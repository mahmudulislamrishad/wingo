<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>James VIP Hack</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --bg: #0c061c;
            --purple: #9d50ff;
            --green: #00ffaa;
            --cyan: #00e5ff;
            --glass: rgba(20, 10, 40, 0.95);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; color: #fff; }
        .game-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }

        .ai-panel {
            position: fixed; top: 15px; left: 15px; width: 175px;
            background: linear-gradient(180deg, #1d0d3d 0%, #0c061c 100%);
            border: 1px solid var(--purple); border-radius: 12px;
            z-index: 9999; box-shadow: 0 0 20px rgba(157, 80, 255, 0.3);
            padding: 6px; box-sizing: border-box; touch-action: none;
        }

        #gate {
            position: absolute; inset: 0; background: var(--glass); backdrop-filter: blur(8px);
            z-index: 10000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 11px;
        }

        .gate-icon { font-size: 20px; color: var(--purple); animation: pulse 2s infinite; }
        .gate-in { width: 80%; padding: 7px; background: rgba(0,0,0,0.6); border: 1px solid var(--purple); border-radius: 5px; color: #fff; text-align: center; font-size: 10px; outline: none; margin-top: 10px;}
        .login-btn { margin-top: 12px; width: 60%; padding: 6px; border-radius: 5px; border: none; background: linear-gradient(45deg, var(--purple), #6a11cb); color: white; font-family: 'Orbitron'; font-size: 8px; cursor: pointer; }

        .p-head { display: flex; justify-content: space-between; font-size: 7px; margin-bottom: 4px; opacity: 0.8; }
        .p-head b { color: var(--purple); }

        .p-timer { display: flex; justify-content: space-between; font-size: 7px; background: rgba(255,255,255,0.05); padding: 2px 4px; border-radius: 3px; margin-bottom: 5px; }
        #timer { color: var(--purple); font-family: 'Orbitron'; font-size: 9px; font-weight: bold; }

        .res-area { display: flex; align-items: center; justify-content: space-around; padding: 3px 0; background: rgba(157, 80, 255, 0.05); border-radius: 5px; margin-bottom: 5px; }
        .p-circle { 
            width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--green);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 14px; box-shadow: 0 0 8px var(--green);
        }
        #res-bs { font-size: 16px; font-weight: 900; color: var(--green); text-shadow: 0 0 5px var(--green); }
        #res-col { font-size: 6px; background: var(--green); color: #000; padding: 1px 5px; border-radius: 2px; font-weight: 800; display: block; margin-top: 2px; text-align: center; }

        .mid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 5px; }
        .card { background: rgba(255,255,255,0.03); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 3px; }
        .lbl { font-size: 5px; color: #888; text-transform: uppercase; display: block; margin-bottom: 2px; }
        
        .hist { height: 35px; overflow-y: auto; font-size: 6px; }
        .h-row { display: flex; justify-content: space-between; border-bottom: 0.1px solid rgba(255,255,255,0.05); padding: 1px 0; }
        
        .acc { font-size: 10px; font-family: 'Orbitron'; color: var(--cyan); }
        .dots { display: flex; gap: 2px; margin-top: 2px; }
        .dot { flex: 1; height: 3px; background: #333; border-radius: 1px; }
        .dot.active { background: var(--purple); }

        .ins-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-bottom: 5px; }
        .ins-box { text-align: center; background: rgba(255,255,255,0.02); padding: 2px; border-radius: 3px; font-size: 5.5px; }
        .ins-v { font-weight: 700; display: block; font-size: 7px; color: var(--purple); }

        .btn-reg { background: linear-gradient(90deg, #ff8a00, #ff006e); color: #fff; text-align: center; padding: 5px; border-radius: 5px; font-size: 9px; font-weight: 800; text-decoration: none; display: block; box-shadow: 0 2px 8px rgba(255, 0, 110, 0.3); }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <iframe class="game-frame" src="https://dkwin0.com/#/register?invitationCode=137681012405"></iframe>

    <div class="ai-panel" id="moveBox">
        <div id="gate">
            <div class="gate-icon">🔒</div>
            <div style="color:var(--purple); font-size:7px; margin-top:5px; font-family:'Orbitron';">𝘔𝘈𝘟 𝘋𝘈𝘋𝘜 𝘉𝘖𝘛</div>
            <input type="password" id="key" class="gate-in" placeholder="ACCESS KEY">
            <button onclick="unlock()" class="login-btn">LOGIN</button>
        </div>

        <div class="p-head">
            <span>James<b>VIP Hack</b></span>
            <div onclick="location.reload()" style="cursor:pointer">✖</div>
        </div>

        <div class="p-timer">
            <span>PERIOD: <b id="p-id">...</b></span>
            <span id="timer">00:30</span>
        </div>

        <div class="res-area">
            <div class="p-circle" id="n-val">?</div>
            <div class="res-txt">
                <span id="res-bs">WAIT</span>
                <span id="res-col">COL</span>
            </div>
        </div>

        <div class="mid-grid">
            <div class="card">
                <span class="lbl">History</span>
                <div class="hist" id="h-box"></div>
            </div>
            <div style="display:flex; flex-direction:column; gap:3px;">
                <div class="card">
                    <span class="lbl">Accuracy</span>
                    <div class="acc">98.4%</div>
                </div>
                <div class="card">
                    <span class="lbl">AI Conf.</span>
                    <div class="dots">
                        <div class="dot active"></div><div class="dot active"></div>
                        <div class="dot active"></div><div class="dot active"></div>
                        <div class="dot active"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="ins-row">
            <div class="ins-box">TREND<span class="ins-v" id="i-trend">...</span></div>
            <div class="ins-box">SUGGEST<span class="ins-v" id="i-suggest">...</span></div>
            <div class="ins-box">RISK<span class="ins-v" style="color:var(--green)">LOW</span></div>
        </div>

        <a href="https://t.me/j0nathan_james" class="btn-reg">Join Telegram</a>
    </div>

    <script>
        // ==========================================================
        // ছবির সব রো (Period 0 থেকে Period 14) এর সম্পূর্ণ লজিক নিচে দেওয়া হলো
        // ==========================================================
        const fullLogicPattern = [
            // Period 0
            ["SMALL","BIG","BIG","SMALL","SMALL","SMALL","BIG","SMALL","SMALL","BIG"],
            // Period 1
            ["BIG","BIG","BIG","BIG","SMALL","BIG","SMALL","SMALL","SMALL","BIG"],
            // Period 2
            ["BIG","SMALL","SMALL","BIG","SMALL","BIG","BIG","BIG","SMALL","BIG"],
            // Period 3
            ["SMALL","SMALL","BIG","BIG","SMALL","SMALL","SMALL","SMALL","BIG","SMALL"],
            // Period 4
            ["SMALL","SMALL","SMALL","SMALL","SMALL","BIG","BIG","BIG","SMALL","SMALL"],
            // Period 5
            ["BIG","SMALL","BIG","BIG","BIG","SMALL","BIG","BIG","BIG","BIG"],
            // Period 6
            ["BIG","SMALL","BIG","BIG","BIG","SMALL","BIG","BIG","BIG","BIG"],
            // Period 7
            ["SMALL","BIG","SMALL","BIG","SMALL","BIG","SMALL","SMALL","BIG","SMALL"],
            // Period 8
            ["SMALL","SMALL","SMALL","SMALL","BIG","BIG","SMALL","BIG","BIG","BIG"],
            // Period 9
            ["BIG","BIG","SMALL","BIG","SMALL","BIG","BIG","SMALL","BIG","BIG"],
            // Period 10
            ["BIG","BIG","SMALL","BIG","SMALL","BIG","SMALL","SMALL","BIG","BIG"],
            // Period 11
            ["BIG","BIG","SMALL","SMALL","BIG","SMALL","BIG","SMALL","SMALL","BIG"],
            // Period 12
            ["BIG","BIG","BIG","SMALL","SMALL","BIG","SMALL","SMALL","BIG","SMALL"],
            // Period 13
            ["BIG","BIG","BIG","SMALL","SMALL","BIG","SMALL","BIG","BIG","SMALL"],
            // Period 14
            ["BIG","SMALL","SMALL","SMALL","BIG","BIG","SMALL","BIG","BIG","SMALL"]
        ];

        function unlock() {
            if(document.getElementById('key').value === "MAX1234") {
                document.getElementById('gate').style.display = 'none';
                startAI();
            } else { alert("ACCESS DENIED"); }
        }

        function startAI() {
            const hBox = document.getElementById('h-box');
            let lastPeriodId = "";

            function update() {
                const now = new Date();
                
                const utcYear = now.getUTCFullYear();
                const utcMonth = String(now.getUTCMonth() + 1).padStart(2, '0');
                const utcDay = String(now.getUTCDate()).padStart(2, '0');
                const utcSecondsPassed = (now.getUTCHours() * 3600) + (now.getUTCMinutes() * 60) + now.getUTCSeconds();
                const periodCount = Math.floor(utcSecondsPassed / 30);
                const baseOffset = 50001; 
                const currentSerial = baseOffset + periodCount;
                const currentPeriodId = `${utcYear}${utcMonth}${utcDay}1000${currentSerial}`;
                
                document.getElementById('p-id').innerText = currentPeriodId;

                const remaining = 30 - (now.getUTCSeconds() % 30);
                document.getElementById('timer').innerText = `00:${remaining < 10 ? '0'+remaining : remaining}`;

                // পিরিয়ড চেঞ্জ হলেই নতুন লজিক সিলেক্ট হবে
                if (currentPeriodId !== lastPeriodId) {
                    lastPeriodId = currentPeriodId;
                    
                    // ০-৯ এর মধ্যে র্যান্ডম নাম্বার জেনারেট
                    let n = Math.floor(Math.random() * 10);
                    
                    // Period Count অনুযায়ী লজিক রো সিলেক্ট (লুপ হবে ১৫ রো শেষে আবার ০ থেকে)
                    const rowIndex = periodCount % fullLogicPattern.length;
                    const pred = fullLogicPattern[rowIndex][n];

                    // কালার লজিক (সাধারণ উইংগো কালার কোড)
                    let col = [1,3,7,9].includes(n) ? "GREEN" : ([2,4,6,8].includes(n) ? "RED" : "VIOLET");
                    let theme = (col === "GREEN") ? "#00ffaa" : (col === "RED" ? "#ff3e3e" : "#9d50ff");

                    document.getElementById('n-val').innerText = n;
                    document.getElementById('n-val').style.borderColor = theme;
                    document.getElementById('n-val').style.boxShadow = `0 0 10px ${theme}`;
                    document.getElementById('res-bs').innerText = pred;
                    document.getElementById('res-bs').style.color = theme;
                    document.getElementById('res-col').innerText = col;
                    document.getElementById('res-col').style.background = theme;
                    document.getElementById('i-trend').innerText = pred;
                    document.getElementById('i-suggest').innerText = pred;

                    let r = document.createElement('div');
                    r.className = 'h-row';
                    r.innerHTML = `<span>...${String(currentSerial).slice(-4)}</span> <span style="color:${theme}">${pred.charAt(0)}(${n})</span>`;
                    hBox.prepend(r);
                }
            }
            setInterval(update, 1000);
            update();
        }

        const box = document.getElementById("moveBox");
        let drag = false, off = [0,0];
        box.addEventListener('touchstart', (e) => {
            if(e.target.tagName==='INPUT' || e.target.tagName==='BUTTON' || e.target.tagName==='A') return;
            drag = true;
            off = [box.offsetLeft - e.touches[0].clientX, box.offsetTop - e.touches[0].clientY];
        });
        box.addEventListener('touchmove', (e) => {
            if (!drag) return; e.preventDefault();
            box.style.left = (e.touches[0].clientX + off[0]) + 'px';
            box.style.top = (e.touches[0].clientY + off[1]) + 'px';
        }, {passive: false});
        box.addEventListener('touchend', () => drag = false);
    </script>
</body>
